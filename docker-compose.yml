services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poms
      POSTGRES_PASSWORD: poms
      POSTGRES_DB: poms
    volumes:
      - poms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poms"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://poms:poms@postgres:5432/poms
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  ellevio-adapter:
    build:
      context: .
      dockerfile: crates/adapters/ellevio/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://poms:poms@postgres:5432/poms
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started

  vattenfall-adapter:
    build:
      context: .
      dockerfile: crates/adapters/vattenfall/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://poms:poms@postgres:5432/poms
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started

  kraftringen-adapter:
    build:
      context: .
      dockerfile: crates/adapters/kraftringen/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://poms:poms@postgres:5432/poms
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started

  tekniskaverken-adapter:
    build:
      context: .
      dockerfile: crates/adapters/tekniskaverken/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://poms:poms@postgres:5432/poms
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started

  oresundskraft-adapter:
    build:
      context: .
      dockerfile: crates/adapters/oresundskraft/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://poms:poms@postgres:5432/poms
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started

volumes:
  poms_pgdata:
